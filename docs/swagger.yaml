      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/theater.Room'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lấy danh sách phòng chiếu của rạp
      tags:
      - rooms
  /theaters/rooms:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin phòng chiếu
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/theater.Room'
      produces:
      - application/json
      responses:
        "201":
